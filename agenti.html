<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c0e22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenții mei">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Agenții mei</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --midnight:#0c0e22; --dusk:#151836; --mist:#e8eaff; --muted:#8f93bd; --lilac:#c9c2ff;
  --line:rgba(160,170,255,.16);
  --research:#43d6c8; --code:#a392ff; --finance:#ffb958; --planner:#b6e35a; --writer:#ff7d9c;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.2,.9,.3,1.15);
  --ease:cubic-bezier(.22,.8,.24,1);
}
.ag-research{--ac:var(--research);--ac-rgb:67,214,200}
.ag-code{--ac:var(--code);--ac-rgb:163,146,255}
.ag-finance{--ac:var(--finance);--ac-rgb:255,185,88}
.ag-planner{--ac:var(--planner);--ac-rgb:182,227,90}
.ag-writer{--ac:var(--writer);--ac-rgb:255,125,156}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%}
body{
  height:100dvh;display:flex;flex-direction:row;overflow:hidden;
  background:var(--midnight);color:var(--mist);
  font:16px/1.55 var(--body);-webkit-text-size-adjust:100%;
}
.app{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;z-index:1}
header,main,form{position:relative;z-index:1}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}

/* fundal: lumini line care plutesc, cate una pentru fiecare agent */
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;width:90vmax;height:90vmax;border-radius:50%;opacity:.5;transition:opacity 1.2s var(--ease);will-change:transform}
.aurora i.boost{opacity:1}
.aurora i:nth-child(1){left:-45vmax;top:-45vmax;background:radial-gradient(closest-side,rgba(67,214,200,.26),transparent);animation:drift1 26s ease-in-out infinite alternate}
.aurora i:nth-child(2){right:-52vmax;top:18vh;background:radial-gradient(closest-side,rgba(163,146,255,.30),transparent);animation:drift2 32s ease-in-out infinite alternate}
.aurora i:nth-child(3){left:-25vmax;bottom:-58vmax;background:radial-gradient(closest-side,rgba(255,185,88,.20),transparent);animation:drift3 38s ease-in-out infinite alternate}
.aurora i:nth-child(4){right:-40vmax;bottom:-55vmax;background:radial-gradient(closest-side,rgba(182,227,90,.15),transparent);animation:drift2 41s ease-in-out infinite alternate-reverse}
.aurora i:nth-child(5){left:20vw;top:-60vmax;background:radial-gradient(closest-side,rgba(255,125,156,.17),transparent);animation:drift1 35s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(20vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-22vmax,-10vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(26vmax,-12vmax) scale(1.12)}}

/* antet */
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:700 19px/1 var(--display);letter-spacing:-.01em}
.mark{width:32px;height:32px;display:block}
.mark .ring{transform-origin:16px 16px;animation:spin 24s linear infinite}
.mark.busy .ring{animation-duration:2.2s}
.mark .core{transform-origin:16px 16px;transition:fill .3s}
.mark.flash .core{animation:coreflash .9s var(--ease)}
@keyframes coreflash{40%{transform:scale(1.9)}}
.icons{display:flex;gap:8px}
.ibtn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:var(--muted);background:rgba(255,255,255,.04);border:1px solid var(--line);
  transition:color .2s,transform .3s var(--spring),opacity .3s,background .2s;
}
.ibtn:hover{color:var(--mist);background:rgba(255,255,255,.08)}
.ibtn:active{transform:scale(.88)}
.ibtn svg{width:18px;height:18px}

/* bara din stanga: conversatii */
.menu-btn,.new-top{display:none}
#side{
  position:fixed;z-index:30;top:0;bottom:0;left:0;width:min(86vw,310px);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:rgba(12,14,34,.95);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .5s var(--ease);
}
body.side-open #side{transform:none;box-shadow:24px 0 60px -20px rgba(0,0,0,.7)}
#scrim{position:fixed;inset:0;z-index:25;background:rgba(4,5,18,.62);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
body.side-open #scrim{opacity:1;pointer-events:auto}
.side-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-left:4px}
.side-head h2{font:700 17px/1 var(--display);letter-spacing:-.01em}
#newBtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:16px;cursor:pointer;
  font:600 15px var(--display);color:var(--mist);border:1px solid rgba(163,146,255,.4);
  background:linear-gradient(135deg,rgba(67,214,200,.14),rgba(163,146,255,.18) 55%,rgba(255,185,88,.14));
  transition:transform .3s var(--spring),box-shadow .3s;
}
#newBtn:hover{box-shadow:0 10px 30px -12px rgba(163,146,255,.7)}
#newBtn:active{transform:scale(.97)}
#newBtn svg{width:18px;height:18px;color:var(--lilac);transition:transform .45s var(--spring)}
#newBtn:hover svg{transform:rotate(90deg)}
#search{
  width:100%;margin-top:10px;font:15px var(--body);color:var(--mist);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;outline:none;transition:border-color .2s,box-shadow .2s;
}
#search::placeholder{color:var(--muted)}
#search:focus{border-color:rgba(163,146,255,.55);box-shadow:0 0 0 3px rgba(163,146,255,.12)}
#chatList{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:12px -4px 0;padding:0 4px;display:flex;flex-direction:column;gap:4px}
.chat-item{display:flex;align-items:center;border-radius:14px;border:1px solid transparent;transition:background .2s,border-color .2s}
.chat-item:hover{background:rgba(255,255,255,.04)}
.chat-item.active{background:rgba(163,146,255,.12);border-color:rgba(163,146,255,.4)}
.ci-main{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:10px 4px 10px 12px;background:none;border:0;text-align:left;cursor:pointer}
.dot{flex:none;width:8px;height:8px;border-radius:50%}
.ci-text{min-width:0;display:flex;flex-direction:column}
.ci-title{font-size:14.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mist)}
.ci-time{font-size:12px;color:var(--muted)}
.ci-act{flex:none;width:30px;height:30px;margin-right:2px;border-radius:9px;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .2s,color .2s,background .2s}
.ci-act svg{width:16px;height:16px}
.chat-item:hover .ci-act,.chat-item:focus-within .ci-act{opacity:1}
@media (hover:none){.ci-act{opacity:.6}}
.ci-act:hover{color:var(--mist);background:rgba(255,255,255,.08)}
.ci-act[data-act="del"]:hover{color:#ff9a9a}
.side-empty{color:var(--muted);font-size:14px;padding:12px 8px;max-width:30ch}
.side-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.side-note{flex:1;font-size:12px;line-height:1.4;color:var(--muted);padding-left:4px}
body.busy .chat-item,body.busy #newBtn,body.busy .new-top{opacity:.45;pointer-events:none}
@keyframes itemin{from{opacity:0;transform:translateX(-18px)}}
@media (max-width:859px){
  .menu-btn,.new-top{display:grid}
  body.side-open .chat-item{animation:itemin .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*40ms + 150ms)}
}
@media (min-width:860px){
  #side{position:relative;transform:none;flex:none;width:290px;z-index:2;background:rgba(12,14,34,.55);box-shadow:none}
  #closeSide,#scrim{display:none}
}

/* zona de scroll */
main{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 12px),transparent 100%);
          mask-image:linear-gradient(to bottom,transparent 0,#000 16px,#000 calc(100% - 12px),transparent 100%);
}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* pagina de start */
.hero-wrap{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .7s var(--ease),opacity .45s var(--ease)}
.hero{min-height:0;overflow:hidden;transition:transform .6s var(--ease),filter .5s var(--ease)}
body.has-chat .hero-wrap{grid-template-rows:0fr;opacity:0;pointer-events:none}
body.has-chat .hero{transform:scale(.93) translateY(-16px);filter:blur(8px)}
.greet{font:700 clamp(32px,9vw,44px)/1.04 var(--display);letter-spacing:-.025em;margin:18px 0 8px;animation:fadein .9s .05s backwards}
.sub{color:var(--muted);max-width:38ch;animation:fadein .9s .2s backwards}
.stage{display:block;width:min(100%,360px);margin:6px auto 2px;overflow:visible}
.stage .lbl{font:600 12.5px var(--display);fill:var(--mist);animation:fadein .7s 1.3s backwards;pointer-events:none}
.stage .lbl2{font:500 11.5px var(--body);fill:var(--muted);animation:fadein .7s 1s backwards;pointer-events:none}
.stage .pop{animation:pop .75s var(--spring) backwards}
.stage .hl{transition:transform .4s var(--spring)}
.stage .n{outline:none}
.stage .n .halo{opacity:.8;transition:opacity .3s;pointer-events:none}
.stage .n.hot .hl{transform:scale(1.14)}
.stage .n.hot .halo{opacity:1}
.stage .float{animation:float 5.5s ease-in-out infinite}
.stage .breathe{transform-origin:160px 158px;animation:breathe 4.5s ease-in-out infinite}
.stage .hring{transform-origin:160px 158px;animation:fadein 1s .2s backwards,spin 120s linear infinite}
.stage .ln{stroke-dasharray:1;animation:draw .9s var(--ease) backwards}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes breathe{50%{transform:scale(1.14);opacity:.8}}
@keyframes fadein{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}

.rows{display:flex;flex-direction:column;gap:10px;padding:6px 0 22px}
.row{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:rgba(21,24,54,.62);border:1px solid var(--line);border-radius:18px;padding:12px 14px;
  transition:transform .3s var(--spring),border-color .25s,box-shadow .3s,background .25s;
  animation:rowin .7s var(--ease) backwards;
}
.row:nth-child(1){animation-delay:1.4s}
.row:nth-child(2){animation-delay:1.5s}
.row:nth-child(3){animation-delay:1.6s}
@keyframes rowin{from{opacity:0;transform:translateY(16px)}}
.row:hover,.row.hot{border-color:rgba(var(--ac-rgb),.55);background:rgba(var(--ac-rgb),.07);box-shadow:0 10px 34px -14px rgba(var(--ac-rgb),.7)}
.row:active{transform:scale(.975)}
.tile{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--ac);background:rgba(var(--ac-rgb),.14)}
.row .q{display:block;font:600 15px/1.3 var(--display);color:var(--mist)}
.row .who{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.row .who b{color:var(--ac);font-weight:600}

/* mesaje */
#messages{display:flex;flex-direction:column;gap:14px;padding:6px 0 18px;transition:opacity .25s var(--ease),transform .25s var(--ease)}
#messages.fade{opacity:0;transform:translateY(10px)}
.msg{max-width:88%;padding:11px 15px;border-radius:20px;overflow-wrap:anywhere;position:relative;scroll-margin-top:8px}
.msg.user{align-self:flex-end;color:#fff;border-bottom-right-radius:6px;background:linear-gradient(135deg,#5b50e8,#7a63f5);box-shadow:0 10px 30px -12px rgba(122,99,245,.75)}
.msg.assistant{align-self:flex-start;border-bottom-left-radius:6px;padding-left:19px;background:rgba(21,24,54,.84);border:1px solid var(--line)}
.msg.assistant::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;
  background:var(--ac,var(--lilac));box-shadow:0 0 14px rgba(var(--ac-rgb,201,194,255),.85);transform-origin:top;
}
.msg.enter.user{animation:inR .55s var(--spring)}
.msg.enter.assistant{animation:inL .7s var(--ease)}
.msg.enter.assistant::before{animation:bar .9s var(--ease) .15s backwards}
@keyframes inR{from{opacity:0;transform:translateX(30px) scale(.9)}}
@keyframes inL{from{opacity:0;transform:translateX(-18px) scale(.96);filter:blur(8px)}}
@keyframes bar{from{transform:scaleY(0)}}
.msg.out,.err.out{opacity:0;transform:scale(.9) translateY(10px);filter:blur(6px);transition:opacity .3s var(--ease),transform .3s var(--ease),filter .3s var(--ease)}
.badge{display:flex;align-items:center;gap:6px;font:600 13px/1 var(--display);color:var(--ac);margin-bottom:6px}
.msg a{color:var(--code);word-break:break-all}
.msg code{font:.88em ui-monospace,Menlo,monospace;background:rgba(163,146,255,.16);color:#ddd8ff;padding:1px 6px;border-radius:6px}
.code{position:relative;margin:10px 0}
.code pre{background:rgba(5,6,20,.75);border:1px solid var(--line);border-radius:12px;padding:38px 14px 12px;overflow-x:auto}
.code code{background:none;padding:0;color:var(--mist);font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre}
.copy{position:absolute;top:8px;right:8px;font:600 12px var(--body);padding:4px 11px;border-radius:999px;cursor:pointer;color:var(--muted);background:rgba(21,24,54,.95);border:1px solid var(--line);transition:color .2s,border-color .2s,transform .25s var(--spring)}
.copy:active{transform:scale(.92)}
.copy.done{color:var(--research);border-color:rgba(67,214,200,.55)}
.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl th{font-weight:600;background:rgba(255,255,255,.04);color:var(--mist)}
.tbl tr:last-child td{border-bottom:0}
.acts{display:flex;gap:4px;margin:8px -6px -4px;animation:fadein .5s backwards}
.act{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--body);color:var(--muted);background:none;border:0;border-radius:999px;padding:5px 10px;cursor:pointer;transition:color .2s,background .2s,transform .25s var(--spring)}
.act svg{width:14px;height:14px}
.act:hover{color:var(--mist);background:rgba(255,255,255,.06)}
.act:active{transform:scale(.93)}
.act.done{color:var(--research)}

.typing{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.dots{display:flex;gap:5px;align-items:center}
.dots i{display:block;width:6px;height:6px;border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.dots i:nth-child(1){background:var(--research)}
.dots i:nth-child(2){background:var(--code);animation-delay:.12s}
.dots i:nth-child(3){background:var(--finance);animation-delay:.24s}
.dots i:nth-child(4){background:var(--planner);animation-delay:.36s}
.dots i:nth-child(5){background:var(--writer);animation-delay:.48s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-6px);opacity:1}}

.err{align-self:center;max-width:92%;text-align:center;font-size:14px;color:#ff9a9a;background:rgba(255,110,110,.08);border:1px solid rgba(255,120,120,.28);padding:8px 14px;border-radius:14px;animation:shake .5s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* compozitor */
form{padding:4px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.composer{
  max-width:680px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:7px 7px 7px 18px;border-radius:28px;
  background:rgba(21,24,54,.78);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 18px 50px -18px rgba(0,0,0,.75);transition:border-color .3s,box-shadow .3s;
}
.composer:focus-within{
  border-color:rgba(var(--ac-rgb,163,146,255),.6);
  box-shadow:0 0 0 4px rgba(var(--ac-rgb,163,146,255),.12),0 18px 50px -18px rgba(var(--ac-rgb,163,146,255),.5);
}
textarea{flex:1;resize:none;max-height:140px;border:0;outline:none;background:transparent;color:var(--mist);font:16px/1.4 var(--body);padding:9px 0}
textarea::placeholder{color:var(--muted)}
#send{
  position:relative;flex:none;width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:#0c0e22;
  background:linear-gradient(135deg,var(--research),var(--code) 55%,var(--finance));
  transform:scale(.86);opacity:.45;transition:transform .4s var(--spring),opacity .25s;
}
#send svg{width:20px;height:20px}
#send.ready,#send.busy{transform:scale(1);opacity:1}
#send:active{transform:scale(.9)}
#send.busy svg{display:none}
#send.busy::before{content:"";width:12px;height:12px;border-radius:3px;background:#0c0e22}
#send.busy::after{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(12,14,34,.25);border-top-color:#0c0e22;animation:spin .9s linear infinite}

/* setari */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,5,18,.66);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.sheet.open{opacity:1;pointer-events:auto}
.sheet-card{
  width:min(100%,460px);max-height:90dvh;overflow-y:auto;background:#12142e;border:1px solid var(--line);border-radius:26px 26px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(60px);transition:transform .55s var(--spring);
  box-shadow:0 -30px 80px -30px rgba(0,0,0,.8);
}
.sheet.open .sheet-card{transform:none}
@media (min-width:860px){.sheet{align-items:center}.sheet-card{border-radius:26px;padding-bottom:20px}}
.sheet h2{font:700 22px/1.1 var(--display);letter-spacing:-.015em;margin-bottom:14px}
.sheet label{display:block;font:600 14px var(--display);margin-bottom:4px}
.hint{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.sheet-note{color:var(--research);font-size:14px;margin-bottom:10px}
.sheet input{width:100%;margin-bottom:8px;font:16px var(--body);color:var(--mist);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.sheet input:focus{border-color:rgba(163,146,255,.6);box-shadow:0 0 0 4px rgba(163,146,255,.12)}
.btn{display:block;width:100%;font:600 15px var(--display);padding:12px 14px;border-radius:14px;cursor:pointer;color:var(--mist);background:rgba(255,255,255,.05);border:1px solid var(--line);margin-top:10px;transition:transform .3s var(--spring),background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#5b50e8,#7a63f5);border-color:transparent;color:#fff}
.btn.danger{color:#ff9a9a;border-color:rgba(255,120,120,.3)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.sheet hr{border:0;border-top:1px solid var(--line);margin:18px 0 4px}
.sec{font:700 16px/1.2 var(--display);margin:6px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn{margin-top:2px}
.sheet-err{color:#ff9a9a;font-size:14px;margin:2px 0 6px}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:middle;transition:background .3s,box-shadow .3s}
.sdot.ok{background:var(--planner);box-shadow:0 0 8px var(--planner)}
.sdot.sync{background:var(--finance);animation:blink 1.2s ease-in-out infinite}
.sdot.err{background:#ff7d7d}
@keyframes blink{50%{opacity:.35}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

};

const $ = (id) => document.getElementById(id);
const box = $("messages"), input = $("input"), sendBtn = $("send"), scroller = $("main");
const mark = document.querySelector(".mark"), markCore = mark.querySelector(".core");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function lsGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch {} }

let token = lsGet(K_TOKEN) || "";
let chats = [], cur = null, hist = [];
let busy = false, abortCtl = null, typingEl = null, typingTimer = null;

const iconSvg = (k, size) =>
  `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${AGENTS[k].icon}</svg>`;

/* ---------- formatare text ---------- */
function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function inline(s){
  return s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/^#{1,4} +(.+)$/gm, "<strong>$1</strong>")
    .replace(/^[-*] +/gm, "• ")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\n/g, "<br>");
}
const ROW_RE = /^\s*\|.*\|\s*$/;
const SEP_RE = /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
function richText(p){
  const lines = p.split("\n"), out = [];
  let buf = [];
  const flush = () => {
    const t = buf.join("\n").replace(/^\n+|\n+$/g, "");
    if (t) out.push(inline(esc(t)));
    buf = [];
  };
  const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(esc(c.trim())));
  for (let i = 0; i < lines.length; i++){
    if (ROW_RE.test(lines[i]) && i + 1 < lines.length && SEP_RE.test(lines[i + 1])){
      flush();
      const rows = [lines[i]];
      let j = i + 2;
      while (j < lines.length && ROW_RE.test(lines[j])) rows.push(lines[j++]);
      out.push('<div class="tbl"><table><thead><tr>' + cells(rows[0]).map(c => "<th>" + c + "</th>").join("") +
        "</tr></thead><tbody>" + rows.slice(1).map(r => "<tr>" + cells(r).map(c => "<td>" + c + "</td>").join("") + "</tr>").join("") +
        "</tbody></table></div>");
      i = j - 1;
    } else buf.push(lines[i]);
  }
  flush();
  return out.join("");
}
function fmt(t){
  return t.split("```").map((p, i) => {
    if (i % 2){
      const code = p.replace(/^[\w+#.-]*\n/, "").replace(/\n$/, "");
      return '<div class="code"><button class="copy" type="button">Copiază</button><pre><code>' + esc(code) + "</code></pre></div>";
    }
    return richText(p);
  }).join("");
}

async function copyText(t){
  try { await navigator.clipboard.writeText(t); }
  catch {
    const a = document.createElement("textarea");
    a.value = t; a.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(a); a.select();
    try { document.execCommand("copy"); } catch {}
    a.remove();
  }
}

/* ---------- stocare conversatii ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function makeTitle(t){
  const s = t.replace(/\s+/g, " ").trim();
  return s.length > 42 ? s.slice(0, 41).trimEnd() + "…" : s;
}
function loadChats(){
  let migrated = false;
  try { chats = JSON.parse(lsGet(K_CHATS) || "[]"); } catch { chats = []; }
  if (!Array.isArray(chats)) chats = [];
  if (!chats.length){
    let old = [];
    try { old = JSON.parse(lsGet(K_HIST) || "[]"); } catch {}
    if (Array.isArray(old) && old.length){
      const first = old.find(m => m.role === "user");
      chats = [{ id: uid(), title: makeTitle(first ? first.content : "Conversație veche"),
                 created: Date.now(), updated: Date.now(), msgs: old }];
      migrated = true;
    }
  }
  chats.forEach(c => {
    c.msgs = (c.msgs || []).map(m => ({ ...m, agent: m.agent || LABEL_TO_KEY[m.label] }));
  });
  cur = migrated ? chats[0] : (chats.find(c => c.id === lsGet(K_ACTIVE)) || null);
  hist = cur ? cur.msgs : [];
  if (migrated){ saveChats(); lsSet(K_ACTIVE, cur.id); }
}
function ensureChat(){
  if (!cur){
    cur = { id: uid(), title: "", created: Date.now(), updated: Date.now(), msgs: [] };
    chats.unshift(cur);
  }
  hist = cur.msgs;
}
function saveChats(){
  chats.sort((a, b) => b.updated - a.updated);
  chats = chats.slice(0, 50);
  lsSet(K_CHATS, JSON.stringify(chats.map(c => ({ ...c, msgs: c.msgs.slice(-100) }))));
}
function save(){
  if (cur) cur.updated = Date.now();
  saveChats();
  lsSet(K_ACTIVE, cur ? cur.id : "");
  renderList();
  if (cur) queuePush(cur);
}

/* ---------- pagina de start ---------- */
function greeting(){
  const h = new Date().getHours();
  return h >= 5 && h < 12 ? "Bună dimineața" : h >= 12 && h < 18 ? "Bună ziua" : "Bună seara";
}
function hot(k, on){
  const n = document.getElementById("n-" + k);
  if (n) n.classList.toggle("hot", on);
  const r = document.querySelector('.row[data-k="' + k + '"]');
  if (r) r.classList.toggle("hot", on);
}
function stageSvg(){
  const CX = 160, CY = 158, R = 106, NR = 24;
  const pos = KEYS.map((k, i) => {
    const a = (-90 + i * 72) * Math.PI / 180;
    return { k, x: +(CX + R * Math.cos(a)).toFixed(1), y: +(CY + R * Math.sin(a)).toFixed(1) };
  });
  const grads = KEYS.map(k => `<radialGradient id="g-${k}"><stop offset="0" stop-color="${AGENTS[k].color}" stop-opacity=".42"/><stop offset="1" stop-color="${AGENTS[k].color}" stop-opacity="0"/></radialGradient>`).join("");
  const lines = pos.map((p, i) => `<path class="ln" pathLength="1" d="M${CX} ${CY} L${p.x} ${p.y}" stroke="${AGENTS[p.k].color}" style="animation-delay:${(.55 + i * .12).toFixed(2)}s"/>`).join("");
  const pulses = pos.map((p, i) => {
    const dur = (2.6 + (i % 3) * .25).toFixed(2), begin = (2 + i * .65).toFixed(2);
    return `<circle r="3.2" fill="${AGENTS[p.k].color}" opacity="0"><animateMotion dur="${dur}s" begin="${begin}s" repeatCount="indefinite" path="M${CX} ${CY} L${p.x} ${p.y}"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.75;1" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/></circle>`;
  }).join("");
  const nodes = pos.map((p, i) => {
    const a = AGENTS[p.k], c = a.color, ox = `transform-origin:${p.x}px ${p.y}px`;
    return `<g class="n" id="n-${p.k}" data-k="${p.k}">` +
      `<g class="pop" style="${ox};animation-delay:${(.95 + i * .1).toFixed(2)}s"><g class="hl" style="${ox}"><g class="float" style="animation-delay:-${(i * 1.1).toFixed(1)}s">` +
      `<circle class="halo" cx="${p.x}" cy="${p.y}" r="44" fill="url(#g-${p.k})"/>` +
      `<circle cx="${p.x}" cy="${p.y}" r="${NR}" fill="#151836"/>` +
      `<circle cx="${p.x}" cy="${p.y}" r="${NR}" fill="rgba(${a.rgb},.16)" stroke="${c}" stroke-width="1.5"/>` +
      `<g transform="translate(${(p.x - 12).toFixed(1)},${(p.y - 12).toFixed(1)})" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${a.icon}</g>` +
      `</g></g></g></g>`;
  }).join("");
  const labels = pos.map((p, i) => `<text class="lbl" x="${p.x}" y="${i === 0 ? (p.y - NR - 9).toFixed(1) : (p.y + NR + 17).toFixed(1)}" text-anchor="middle">${AGENTS[p.k].name}</text>`).join("");
  return `<svg class="stage" viewBox="0 0 320 292" role="group" aria-label="Orchestratorul în centru, conectat la cei cinci agenți">` +
    `<defs><radialGradient id="gCore"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#c9c2ff"/><stop offset="1" stop-color="#7a63f5"/></radialGradient>` +
    `<radialGradient id="gGlow"><stop offset="0" stop-color="#a392ff" stop-opacity=".6"/><stop offset="1" stop-color="#a392ff" stop-opacity="0"/></radialGradient>${grads}</defs>` +
    `<circle class="hring" cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="rgba(201,194,255,.2)" stroke-width="1" stroke-dasharray="2 6"/>` +
    `<g fill="none" stroke-linecap="round" stroke-width="1.5" opacity=".6">${lines}</g>${pulses}${nodes}${labels}` +
    `<g class="pop" style="transform-origin:${CX}px ${CY}px;animation-delay:.1s">` +
    `<circle class="breathe" cx="${CX}" cy="${CY}" r="64" fill="url(#gGlow)"/>` +
    `<circle cx="${CX}" cy="${CY}" r="21" fill="url(#gCore)"/></g>` +
    `<rect x="${CX - 48}" y="${CY + 26}" width="96" height="20" rx="10" fill="#0c0e22" opacity=".85"/>` +
    `<text class="lbl2" x="${CX}" y="${CY + 40}" text-anchor="middle">Orchestrator</text></svg>`;
}
function buildHero(){
  const hero = $("hero");
  hero.innerHTML = "";
  hero.appendChild($("heroTpl").content.cloneNode(true));
  hero.querySelector(".greet").textContent = greeting() + ". Ce rezolvăm?";
  hero.querySelector(".stagebox").innerHTML = stageSvg();
  const rows = hero.querySelector(".rows");
  [...KEYS].sort(() => Math.random() - .5).slice(0, 3).forEach((k) => {
    const a = AGENTS[k];
    const b = document.createElement("button");
    b.type = "button"; b.className = "row ag-" + k; b.dataset.k = k;
    b.innerHTML = '<span class="tile">' + iconSvg(k, 22) + '</span><span><span class="q">' +
      esc(a.ask) + '</span><span class="who"><b>' + a.name + "</b> " + a.does + "</span></span>";
    b.addEventListener("click", () => send(a.ask));
    ["pointerenter", "pointerdown", "focus"].forEach(ev => b.addEventListener(ev, () => hot(k, true)));
    ["pointerleave", "pointerup", "pointercancel", "blur"].forEach(ev => b.addEventListener(ev, () => hot(k, false)));
    rows.appendChild(b);
  });
  if (reduceMotion){ const s = hero.querySelector(".stage"); if (s.pauseAnimations) s.pauseAnimations(); }
}

function setChat(on){
  document.body.classList.toggle("has-chat", on);
  if (!on){ buildHero(); scroller.scrollTo({ top: 0 }); }
}

/* ---------- mesaje ---------- */
function reveal(el, text){
  const body = el.querySelector(".body");
  if (reduceMotion || text.length < 40){ body.innerHTML = fmt(text); return Promise.resolve(); }
  const total = text.length, dur = Math.min(2600, Math.max(700, total * 6)), t0 = performance.now();
  return new Promise((res) => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true; el.removeEventListener("click", finish);
      body.innerHTML = fmt(text); res();
    };
    el.addEventListener("click", finish);
    (function step(now){
      if (done) return;
      const p = Math.min(1, (now - t0) / dur);
      if (p >= 1) return finish();
      let n = Math.floor(total * p * (2 - p));
      const c = text.charCodeAt(n - 1);
      if (c >= 0xD800 && c <= 0xDBFF) n--;
      body.innerHTML = fmt(text.slice(0, n));
      requestAnimationFrame(step);
    })(t0);
  });
}
function addActs(el, last){
  const a = document.createElement("div");
  a.className = "acts";
  a.innerHTML = '<button class="act" data-do="copy" type="button">' + ICO.copy + "Copiază</button>" +
    (last ? '<button class="act act-regen" data-do="regen" type="button">' + ICO.redo + "Din nou</button>" : "");
  el.appendChild(a);
}
function addMsg(m, animate, rev){
  const d = document.createElement("div");
  const k = m.role === "assistant" && AGENTS[m.agent] ? m.agent : null;
  d.className = "msg " + m.role + (k ? " ag-" + k : "") + (animate ? " enter" : "");
  d._m = m;
  d.innerHTML = (k ? '<div class="badge">' + iconSvg(k, 15) + AGENTS[k].name + "</div>" : "") + '<div class="body"></div>';
  box.appendChild(d);
  if (rev && m.role === "assistant") reveal(d, m.content).then(() => addActs(d, true));
  else d.querySelector(".body").innerHTML = fmt(m.content);
  return d;
}
function renderHist(){
  box.innerHTML = "";
  hist.forEach((m, i) => {
    const el = addMsg(m, false);
    if (m.role === "assistant") addActs(el, i === hist.length - 1);
  });
}
function scrollEnd(){ scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" }); }
function err(t){
  const e = document.createElement("div");
  e.className = "err"; e.textContent = t;
  box.appendChild(e); scrollEnd();
}
function showTyping(){
  typingEl = document.createElement("div");
  typingEl.className = "msg assistant typing enter";
  typingEl.innerHTML = '<span class="dots"><i></i><i></i><i></i><i></i><i></i></span><span class="tt">' +
    "Orchestratorul alege agentul…" + "</span>";
  box.appendChild(typingEl);
  typingTimer = setTimeout(() => {
    const t = typingEl && typingEl.querySelector(".tt");
    if (t) t.textContent = "Agentul lucrează la răspuns…";
  }, 2200);
  mark.classList.add("busy");
}
function hideTyping(){
  clearTimeout(typingTimer);
  if (typingEl){ typingEl.remove(); typingEl = null; }
  mark.classList.remove("busy");
}
function flash(k){
  const a = AGENTS[k]; if (!a) return;
  markCore.setAttribute("fill", a.color);
  mark.classList.remove("flash"); void mark.getBoundingClientRect(); mark.classList.add("flash");
  const blob = document.querySelector('.aurora i[data-a="' + k + '"]');
  if (blob) blob.classList.add("boost");
  setTimeout(() => {
    mark.classList.remove("flash");
    markCore.setAttribute("fill", "#c9c2ff");
    if (blob) blob.classList.remove("boost");
  }, 1500);
}

box.addEventListener("click", (e) => {
  const cp = e.target.closest(".copy");
  if (cp){
    copyText(cp.parentElement.querySelector("code").textContent).then(() => {
      cp.textContent = "Copiat"; cp.classList.add("done");
      setTimeout(() => { cp.textContent = "Copiază"; cp.classList.remove("done"); }, 1600);
    });
    return;
  }
  const ac = e.target.closest(".act");
  if (!ac) return;
  if (ac.dataset.do === "regen"){ regenerate(); return; }
  const msg = ac.closest(".msg");
  copyText(msg._m.content).then(() => {
    ac.classList.add("done"); ac.innerHTML = ICO.check + "Copiat";
    setTimeout(() => { ac.classList.remove("done"); ac.innerHTML = ICO.copy + "Copiază"; }, 1600);
  });
});

function regenerate(){
  if (busy || !cur) return;
  const a = hist[hist.length - 1], u = hist[hist.length - 2];
  if (!a || a.role !== "assistant" || !u || u.role !== "user") return;
  hist.pop(); hist.pop(); save();
  [...box.querySelectorAll(".msg")].slice(-2).forEach(el => el.remove());
  send(u.content);
}

/* ---------- trimitere ---------- */
async function send(text){
  text = (text || "").trim();
  if (!text || busy) return;
  if (!token){ openSettings(true); return; }

  box.querySelectorAll(".err").forEach(e => e.remove());
  ensureChat();
  const past = hist.slice(-20).map(({ role, content }) => ({ role, content }));
  hist.push({ role: "user", content: text });
  if (!cur.title) cur.title = makeTitle(text);
  save();
  if (!document.body.classList.contains("has-chat")) setChat(true);
  const u = addMsg({ role: "user", content: text }, true);
  input.value = ""; resize(); sync();
  busy = true; sendBtn.classList.add("busy"); sendBtn.setAttribute("aria-label", "Oprește");
  document.body.classList.add("busy");
  showTyping(); scrollEnd();
  abortCtl = new AbortController();

  const fail = (msg) => {
    hist.pop(); u.remove();
    if (!hist.length && cur){ cloudDelete(cur.id); chats = chats.filter(c => c !== cur); cur = null; }
    save();
    input.value = text; resize(); sync();
    if (msg) err(msg);
  };

  try {
    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ message: text, history: past }),
      signal: abortCtl.signal
    });
    const data = await r.json().catch(() => ({}));
    hideTyping();
    if (r.status === 401) fail("Parolă greșită. Deschide Setări și introdu-o din nou.");
    else if (!r.ok || data.error) fail("Eroare: " + (data.error || r.status));
    else {
      const m = { role: "assistant", content: data.reply, agent: data.agent };
      hist.push(m); save();
      box.querySelectorAll(".act-regen").forEach(x => x.remove());
      const el = addMsg(m, true, true);
      flash(data.agent);
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  } catch (e){
    hideTyping();
    fail(e.name === "AbortError" ? null : "Nu m-am putut conecta. Verifică internetul și încearcă din nou.");
  } finally {
    busy = false; abortCtl = null;
    sendBtn.classList.remove("busy"); sendBtn.setAttribute("aria-label", "Trimite");
    document.body.classList.remove("busy");
  }
}

/* ---------- compozitor ---------- */
function resize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
function sync(){ sendBtn.classList.toggle("ready", input.value.trim().length > 0); }
input.addEventListener("input", () => { resize(); sync(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches){
    e.preventDefault(); if (!busy) send(input.value);
  }
});
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy){ if (abortCtl) abortCtl.abort(); return; }
  send(input.value);
});

/* ---------- conversatii (bara din stanga) ---------- */
function openSide(){ document.body.classList.add("side-open"); }
function closeSide(){ document.body.classList.remove("side-open"); }

function relTime(ts){
  const d = new Date(ts), n = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(n) - day(d)) / 86400000);
  if (diff === 0) return "azi, " + d.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
  if (diff === 1) return "ieri";
  return d.toLocaleDateString("ro-RO", { day: "numeric", month: "short" });
}

function renderList(){
  const list = $("chatList"), search = $("search");
  search.hidden = chats.length < 5;
  if (search.hidden) search.value = "";
  const q = search.value.trim().toLowerCase();
  const sorted = [...chats].sort((a, b) => b.updated - a.updated)
    .filter(c => !q || (c.title || "").toLowerCase().includes(q) || c.msgs.some(m => m.content.toLowerCase().includes(q)));
  list.innerHTML = "";
  if (!sorted.length){
    list.innerHTML = '<p class="side-empty">' + (q ? "Nu am găsit nimic pentru căutarea ta." : "Aici apar conversațiile tale. Prima se salvează când trimiți un mesaj.") + "</p>";
    return;
  }
  sorted.forEach((c, i) => {
    const last = [...c.msgs].reverse().find(m => m.role === "assistant" && AGENTS[m.agent]);
    const color = last ? AGENTS[last.agent].color : "#c9c2ff";
    const row = document.createElement("div");
    row.className = "chat-item" + (cur && cur.id === c.id ? " active" : "");
    row.style.setProperty("--i", i);
    row.dataset.id = c.id;
    row.innerHTML =
      '<button class="ci-main" type="button"><i class="dot" style="background:' + color + ';box-shadow:0 0 8px ' + color + '"></i>' +
      '<span class="ci-text"><span class="ci-title"></span><span class="ci-time"></span></span></button>' +
      '<button class="ci-act" type="button" data-act="edit" aria-label="Redenumește">' + ICO.edit + "</button>" +
      '<button class="ci-act" type="button" data-act="del" aria-label="Șterge">' + ICO.del + "</button>";
    row.querySelector(".ci-title").textContent = c.title || "Conversație nouă";
    row.querySelector(".ci-time").textContent = relTime(c.updated);
    list.appendChild(row);
  });
}

function dissolve(cb){
  const items = [...box.children];
  items.forEach((el, i) => { el.style.transitionDelay = (i * 30) + "ms"; el.classList.add("out"); });
  setTimeout(cb, items.length ? 350 + Math.min(items.length, 10) * 30 : 0);
}

function newChat(){
  closeSide();
  if (busy) return;
  if (!cur && !hist.length && !document.body.classList.contains("has-chat")) return;
  cur = null; hist = [];
  lsSet(K_ACTIVE, ""); renderList();
  dissolve(() => { box.innerHTML = ""; setChat(false); });
}

function openChat(id){
  closeSide();
  if (busy || (cur && cur.id === id)) return;
  const c = chats.find(x => x.id === id);
  if (!c) return;
  cur = c; hist = c.msgs;
  lsSet(K_ACTIVE, c.id); renderList();
  box.classList.add("fade");
  setTimeout(() => {
    renderHist();
    document.body.classList.add("has-chat");
    box.classList.remove("fade");
    scroller.scrollTo({ top: scroller.scrollHeight, behavior: "instant" });
  }, 220);
}

function renameChat(id){
  const c = chats.find(x => x.id === id);
  if (!c) return;
  const t = prompt("Nume nou pentru conversație:", c.title);
  if (t && t.trim()){ c.title = t.trim().slice(0, 60); c.updated = Date.now(); saveChats(); renderList(); queuePush(c); }
}

function deleteChat(id){
  if (busy) return;
  const c = chats.find(x => x.id === id);
  if (!c || !confirm("Ștergi conversația „" + (c.title || "fără nume") + "”?")) return;
  const wasActive = cur === c;
  cloudDelete(c.id);
  chats = chats.filter(x => x !== c);
  if (wasActive){
    cur = null; hist = [];
    dissolve(() => { box.innerHTML = ""; setChat(false); });
  }
  save();
}

$("chatList").addEventListener("click", (e) => {
  const row = e.target.closest(".chat-item");
  if (!row) return;

  if (act){ return act.dataset.act === "del" ? deleteChat(row.dataset.id) : renameChat(row.dataset.id); }
  openChat(row.dataset.id);
});

/* gesturi: tragi de la marginea stanga ca sa deschizi, spre stanga ca sa inchizi */
let tx = 0, ty = 0, swipe = null;
document.addEventListener("touchstart", (e) => {
  const t = e.touches[0]; tx = t.clientX; ty = t.clientY;
  swipe = document.body.classList.contains("side-open") ? "close" : (tx < 22 ? "open" : null);
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!swipe) return;
  const t = e.changedTouches[0], dx = t.clientX - tx;
  if (Math.abs(t.clientY - ty) < 60){
    if (swipe === "open" && dx > 70) openSide();
    if (swipe === "close" && dx < -70) closeSide();
  }
  swipe = null;
}, { passive: true });

/* ---------- sincronizare Firebase (email + parola, Firestore) ---------- */
const FB_BASE = "https://www.gstatic.com/firebasejs/10.14.1/";
let fb = null, fbUser = null, fbUnsub = null, firstSyncDone = false;
const pushTimers = {};

function setSync(state, text){
  const d = $("sdot"); if (d) d.className = "sdot " + state;
  const t = $("syncStatus"); if (t) t.textContent = text;
}
function authMsg(text, good){
  const el = $("authMsg");
  el.hidden = !text; el.textContent = text || ""; el.style.color = good ? "var(--research)" : "";
}
function authError(code){
  if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-login-credentials"].includes(code)) return "Email sau parolă greșite.";
  const m = {
    "auth/email-already-in-use": "Există deja un cont cu acest email. Apasă Conectează-te.",
    "auth/weak-password": "Parola e prea slabă. Folosește minim 6 caractere.",
    "auth/invalid-email": "Emailul nu pare valid.",
    "auth/operation-not-allowed": "Autentificarea cu email nu e activată în Firebase.",
    "auth/network-request-failed": "Fără conexiune la internet.",
    "auth/too-many-requests": "Prea multe încercări. Așteaptă puțin și încearcă din nou."
  };
  return m[code] || "Eroare: " + code;
}
function renderSyncUI(){
  const form = $("syncForm"), on = $("syncOn"), hint = $("syncHint");
  if (!SYNC_ON){
    form.hidden = true; on.hidden = true;
    hint.textContent = "Sincronizarea nu e configurată încă. Completează FIREBASE_CONFIG în agenti.html.";
    setSync("off", "Conversațiile se salvează doar pe acest dispozitiv.");
    return;
  }
  if (fbUser){
    form.hidden = true; on.hidden = false;
    $("syncUser").textContent = "Conectat ca " + fbUser.email + ".";
    hint.textContent = "Conversațiile se sincronizează între toate dispozitivele conectate la acest cont.";
  } else {
    form.hidden = false; on.hidden = true;
    hint.textContent = "Conectează-te pe fiecare dispozitiv cu același email și aceeași parolă ca să vezi aceleași conversații.";
    setSync("off", fb ? "Neconectat. Conversațiile sunt doar pe acest dispozitiv." : "Se încarcă sincronizarea…");
  }
}
async function initSync(){
  renderSyncUI();
  if (!SYNC_ON) return;
  try {
    const [appM, authM, fsM] = await Promise.all([
      import(FB_BASE + "firebase-app.js"), import(FB_BASE + "firebase-auth.js"), import(FB_BASE + "firebase-firestore.js")
    ]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    fb = { A: authM, F: fsM, auth: authM.getAuth(app), db: fsM.getFirestore(app) };
    authM.onAuthStateChanged(fb.auth, (u) => {
      fbUser = u;
      if (u) startListening(); else stopListening();
      renderSyncUI();
    });
  } catch (e){
    setSync("err", "Sincronizarea nu a putut porni. Verifică internetul.");
  }
}
function stopListening(){
  if (fbUnsub){ fbUnsub(); fbUnsub = null; }
  Object.keys(pushTimers).forEach(k => { clearTimeout(pushTimers[k]); delete pushTimers[k]; });
}
function startListening(){
  stopListening(); firstSyncDone = false;
  setSync("sync", "Se sincronizează…");
  const col = fb.F.collection(fb.db, "users", fbUser.uid, "chats");
  fbUnsub = fb.F.onSnapshot(col, { includeMetadataChanges: true }, applyRemote, (e) => {
    setSync("err", e && e.code === "permission-denied" ? "Regulile Firestore blochează accesul." : "Eroare de sincronizare.");
  });
}
function applyRemote(snap){
  let changed = false, curGone = false, curNew = false;
  snap.docChanges().forEach((ch) => {
    const d = ch.doc, id = d.id;
    if (d.metadata && d.metadata.hasPendingWrites) return;
    if (ch.type === "removed"){
      const i = chats.findIndex(c => c.id === id);
      if (i >= 0){ if (cur && cur.id === id) curGone = true; chats.splice(i, 1); changed = true; }
      return;
    }
    const r = d.data() || {};
    const msgs = (r.msgs || []).map(m => ({ ...m, agent: m.agent || LABEL_TO_KEY[m.label] }));
    const local = chats.find(c => c.id === id);
    if (!local){
      chats.push({ id, title: r.title || "", created: r.created || r.updated || 0, updated: r.updated || 0, msgs });
      changed = true;
    } else if ((r.updated || 0) > (local.updated || 0)){
      if (busy && cur === local) return;
      local.title = r.title || ""; local.updated = r.updated; local.msgs = msgs;
      changed = true;
      if (cur === local) curNew = true;
    }
  });
  if (!firstSyncDone && !snap.metadata.fromCache){
    firstSyncDone = true;
    const remote = new Map(snap.docs.map(d => [d.id, (d.data() || {}).updated || 0]));
    chats.forEach(c => { if (!remote.has(c.id) || c.updated > remote.get(c.id)) queuePush(c); });
  }
  if (changed){
    saveChats();
    if (curGone && !busy){ cur = null; hist = []; lsSet(K_ACTIVE, ""); box.innerHTML = ""; setChat(false); }
    else if (curNew && !busy && !curGone){
      hist = cur.msgs; renderHist();
      scroller.scrollTo({ top: scroller.scrollHeight, behavior: "instant" });
    }
    renderList();
  }
  if (!snap.metadata.hasPendingWrites && !snap.metadata.fromCache) setSync("ok", "Sincronizat");
  else setSync("sync", navigator.onLine ? "Se sincronizează…" : "Offline, se sincronizează la reconectare");
}
function queuePush(c){
  if (!fb || !fbUser || !c) return;
  clearTimeout(pushTimers[c.id]);
  setSync("sync", "Se sincronizează…");
  pushTimers[c.id] = setTimeout(() => pushChat(c), 700);
}
async function pushChat(c){
  if (!fb || !fbUser) return;
  try {
    const msgs = c.msgs.slice(-60).map(m => ({ role: m.role, content: m.content, ...(m.agent ? { agent: m.agent } : {}) }));
    while (JSON.stringify(msgs).length > 800000 && msgs.length > 2) msgs.shift();
    await fb.F.setDoc(fb.F.doc(fb.db, "users", fbUser.uid, "chats", c.id),
      { title: c.title || "", created: c.created || c.updated, updated: c.updated, msgs });
  } catch (e){
    setSync("err", "Nu s-a putut sincroniza. Reîncerc la următoarea salvare.");
  }
}
async function cloudDelete(id){
  if (!fb || !fbUser) return;
  clearTimeout(pushTimers[id]);
  try { await fb.F.deleteDoc(fb.F.doc(fb.db, "users", fbUser.uid, "chats", id)); } catch {}
}
async function doAuth(create){
  if (!fb){ authMsg("Sincronizarea se încarcă. Încearcă din nou într-o clipă."); return; }
  const email = $("syncEmail").value.trim(), pass = $("syncPass").value;
  if (!email || pass.length < 6){ authMsg("Scrie emailul și o parolă de minim 6 caractere."); return; }
  try {
    if (create) await fb.A.createUserWithEmailAndPassword(fb.auth, email, pass);
    else await fb.A.signInWithEmailAndPassword(fb.auth, email, pass);
    $("syncPass").value = ""; authMsg("");
  } catch (e){ authMsg(authError(e.code)); }
}
async function resetPass(){
  const email = $("syncEmail").value.trim();
  if (!fb || !email){ authMsg("Scrie emailul mai sus, apoi apasă din nou."); return; }
  try { await fb.A.sendPasswordResetEmail(fb.auth, email); authMsg("Ți-am trimis un email pentru resetarea parolei.", true); }
  catch (e){ authMsg(authError(e.code)); }
}
$("signInBtn").addEventListener("click", () => doAuth(false));
$("signUpBtn").addEventListener("click", () => doAuth(true));
$("resetBtn").addEventListener("click", resetPass);
$("signOutBtn").addEventListener("click", () => { if (fb) fb.A.signOut(fb.auth); });
$("syncPass").addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth(false); });
window.addEventListener("online", () => { if (fbUser) setSync("sync", "Se sincronizează…"); });
window.addEventListener("offline", () => { if (fbUser) setSync("sync", "Offline, se sincronizează la reconectare"); });

buildHero();
renderHist();
renderList();
initSync();
if (hist.length){
  document.body.classList.add("has-chat");
  requestAnimationFrame(() => scroller.scrollTo({ top: scroller.scrollHeight, behavior: "instant" }));
}
