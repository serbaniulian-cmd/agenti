function tbl(r){

    rows.slice(1).map(x=>"<tr>"+x.map(y=>"<td>"+y+"</td>").join("")+"</tr>").join("") + "</tbody></table></div>";
}
function md(t){
  let out = "";
  t.split("```").forEach((p, i) => {
    if (i % 2){ out += "<pre><code>" + esc(p.replace(/^[^\n]*\n/,"")) + "</code></pre>"; return; }
    let list = "", tb = [];
    const closeList = () => { if (list){ out += "</" + list + ">"; list = ""; } };
    const openList = k => { if (list !== k){ closeList(); out += "<" + k + ">"; list = k; } };
    p.split("\n").forEach(l => {
      let m;
      if (/^\s*\|.*\|\s*$/.test(l)){ closeList(); tb.push(l); return; }
      if (tb.length){ out += tbl(tb); tb = []; }
      if ((m = /^\s*[-*•]\s+(.*)/.exec(l))){ openList("ul"); out += "<li>" + inl(m[1]) + "</li>"; }
      else if ((m = /^\s*\d+[.)]\s+(.*)/.exec(l))){ openList("ol"); out += "<li>" + inl(m[1]) + "</li>"; }
      else { closeList(); if ((m = /^#{1,6}\s+(.*)/.exec(l))) out += "<h4>" + inl(m[1]) + "</h4>"; else if (l.trim()) out += "<p>" + inl(l) + "</p>"; }
    });
    closeList(); if (tb.length) out += tbl(tb);
  });
  return out;
}

    }
  } catch (e){ if (e.name !== "AbortError") err = String(e.message || e); }
  busy = false; ctl = null; document.body.classList.remove("busy"); $("send").classList.remove("stop"); $("send").textContent = "↑";
  if (!m.c){ msgs.splice(msgs.indexOf(m) - 1, 2); $("inp").value = t; fit(); if (mine.length){ pics = mine.slice(); drawThumbs(); } if (err) toast(err); }
  else if (err) toast("Răspunsul s-a întrerupt: " + err);
  save(); draw();
}

function fit(){ const i = $("inp"); i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, 140) + "px"; }
function open(id){ $(id).classList.add("on"); }
function close(id){ $(id).classList.remove("on"); }
function openSet(need){ $("setNote").textContent = need ? "Introdu parola ca să trimiți primul mesaj. Este aceeași cu APP_TOKEN din Cloudflare." : "Parola este aceeași cu APP_TOKEN din Cloudflare. Rămâne doar pe acest dispozitiv."; $("tok").value = token; open("shSet"); }

function drawList(){
  const q = $("q").value.trim().toLowerCase();
  const items = ALL.filter(a => (cat === "all" || a[3] === cat) && (!q || (a[1] + " " + a[4] + " " + CAT[a[3]] + " " + a[3]).toLowerCase().includes(q)));
  $("list").innerHTML = items.map(a => '<button class="row' + (a[0] === agent ? " on" : "") + '" data-id="' + esc(a[0]) + '" type="button"><span class="em">' + (a[2] || "🤖") + '</span><span><b>' + esc(a[1]) + "</b><small>" + esc(a[4]) + "</small></span></button>").join("") || '<p class="none">Nimic găsit.</p>';
}
function drawCats(){
  const have = new Set(ALL.map(a => a[3]));
  $("cats").innerHTML = ["all", ...Object.keys(CAT).filter(k => have.has(k))].map(k => '<button class="cat' + (k === cat ? " on" : "") + '" data-c="' + k + '" type="button">' + (k === "all" ? "Toți" : CAT[k]) + "</button>").join("");
}
function openPick(){ $("q").value = ""; cat = "all"; drawCats(); drawList(); open("shPick"); }

function tint(){
  const st = document.querySelector(".bg").style;
  if (agent === "fast"){ ["--c1","--c2","--c3"].forEach(k => st.removeProperty(k)); return; }
  let h = 0; for (const c of agent) h = (h * 31 + c.charCodeAt(0)) % 360;
  st.setProperty("--c1", "hsl(" + h + ",85%,52%)"); st.setProperty("--c2", "hsl(" + ((h + 60) % 360) + ",85%,48%)"); st.setProperty("--c3", "hsl(" + ((h + 130) % 360) + ",80%,52%)");
}
let rafS = 0;
$("main").addEventListener("scroll", () => { if (rafS) return; rafS = requestAnimationFrame(() => { rafS = 0; document.documentElement.style.setProperty("--hx", (18 + ($("main").scrollTop / 9) % 64) + "%"); }); }, {passive:true});
function regen(){ const i = msgs.length - 1; if (busy || i < 1 || msgs[i].r !== "assistant" || msgs[i-1].r !== "user") return; const u = msgs[i-1]; if (u.ni && !u.i){ toast("Pozele nu mai sunt disponibile după închiderea paginii."); return; } msgs.splice(i - 1, 2); save(); send(u.c, u.i); }
function newChat(){
  if (busy){ toast("Oprește mai întâi răspunsul."); return; }
  agent = "fast"; chipUpdate(); tint();
  if (msgs.length){ ch = mk(); chats.push(ch); msgs = ch.m; save(); }
  seen = 0; draw(); close("shChats");
}
function drawChats(){
  $("chatList").innerHTML = chats.slice().sort((a,b) => b.u - a.u).map(c => '<div class="crow' + (c.id === ch.id ? " on" : "") + '" data-id="' + c.id + '"><button class="ct" type="button"><b>' + esc(c.t || "Chat nou") + "</b><small>" + new Date(c.u).toLocaleString("ro-RO", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) + '</small></button><button class="cd" type="button" aria-label="Șterge">🗑</button></div>').join("");
}
$("chatsBtn").onclick = () => { drawChats(); open("shChats"); };
$("newInSheet").onclick = newChat;
$("chatList").onclick = e => {
  const r = e.target.closest(".crow"); if (!r) return;
  if (busy){ toast("Oprește mai întâi răspunsul."); return; }
  const id = r.dataset.id;
  if (e.target.closest(".cd")){
    if (!confirm("Ștergi conversația?")) return;
    chats = chats.filter(c => c.id !== id); if (!chats.length) chats = [mk()];
    if (id === ch.id){ ch = chats[0]; msgs = ch.m; agent = "fast"; chipUpdate(); tint(); seen = 0; draw(); }
    save(); drawChats(); return;
  }
  ch = chats.find(c => c.id === id); msgs = ch.m; agent = "fast"; chipUpdate(); tint(); seen = 0; save(); draw(); toBottom(); close("shChats");
};
$("clip").onclick = () => { if (pics.length >= 4){ toast("Maxim 4 poze la un mesaj."); return; } $("file").click(); };
$("file").onchange = async e => {
  const fs = [...e.target.files].slice(0, 4 - pics.length); e.target.value = "";
  for (const f of fs){ try { pics.push(await shrink(f)); } catch { toast("Nu am putut citi poza."); } }
  drawThumbs();
};
$("thumbs").onclick = e => { const b = e.target.closest("button"); if (!b) return; pics.splice(+b.dataset.i, 1); drawThumbs(); };
$("pick").onclick = openPick;
$("msgs").addEventListener("click", e => {
  if (e.target.id === "heroPick") openPick();
  if (e.target.id === "heroFast"){ agent = "fast"; chipUpdate(); tint(); draw(); }
  const x = e.target.closest(".act");
  if (x && !busy){ if (x.dataset.a === "rg") regen(); else { const i = +x.dataset.i; $("inp").value = msgs[i].c; pics = toPics(msgs[i].i); drawThumbs(); msgs.splice(i); save(); draw(); fit(); $("inp").focus(); } }
  const c = e.target.closest(".cp");
  if (c) navigator.clipboard.writeText(msgs[+c.dataset.i].c).then(() => { c.textContent = "Copiat ✓"; setTimeout(() => c.textContent = "Copiază", 1500); }).catch(() => toast("Nu am putut copia."));
});
$("q").oninput = drawList;
$("cats").onclick = e => { const b = e.target.closest(".cat"); if (!b) return; cat = b.dataset.c; drawCats(); drawList(); };
$("list").onclick = e => {
  const b = e.target.closest(".row"); if (!b) return;
  agent = b.dataset.id; chipUpdate(); tint(); if (!msgs.length) draw(); close("shPick"); $("inp").focus();
};
$("newBtn").onclick = newChat;
$("setBtn").onclick = () => openSet(false);
$("closeSet").onclick = () => close("shSet");
$("saveTok").onclick = () => { token = $("tok").value.trim(); ls.s("ag_token", token); close("shSet"); };
["shPick","shSet","shChats"].forEach(id => $(id).addEventListener("click", e => { if (e.target.id === id) close(id); }));
$("send").onclick = send;
$("inp").addEventListener("input", fit);
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); send(); } });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("agenti-sw.js").catch(() => {});
chipUpdate(); tint(); seen = msgs.length; draw(); toBottom();
</script></body></html>
